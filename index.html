<script type="text/babel">
const { useState, useEffect, useCallback } = React;

// ==================== DADOS ====================
const conteudoCompleto = {
  superResumo: [
    "🎯 FATORES DA LIDERANÇA: Líder, Liderados, Situação e Comunicação",
    "🎭 EIXOS DE LIDERANÇA: Centralização de Poder, Tipo de Incentivo, Foco do Líder",
    "📊 ESTILOS (Centralização): Centralizadora, Participativa, Delegativa",
    "💡 ESTILOS (Incentivo): Transformacional, Transacional",
    "🎯 ESTILOS (Foco): Orientada para Tarefa, Orientada para Relacionamento",
    "🧠 PERSONALIDADE: Resultante psicofísica da hereditariedade + meio",
    "🌡️ TEMPERAMENTO: Sanguíneo, Melancólico, Colérico, Fleumático",
    "🆔 ID, EGO, SUPEREGO: Instintos, Reflexão/Consciência, Consciência Moral",
    "📈 NÍVEIS: Líderes Diretos, Organizacionais, Estratégicos",
    "🔥 BURNOUT: Exaustão emocional, estresse no trabalho, falta de energia",
    "🪟 JANELA DE JOHARI: Área Aberta, Cega, Secreta, Desconhecida",
    "🎓 ATRIBUTOS DO LÍDER: Altruísmo, Flexibilidade, Comunicação, Iniciativa",
    "🔄 MÉTODOS DE ATITUDE: Direto e Indireto",
    "🎭 MODOS DE AGIR: Ditador, Tirano, Líder, Comandante",
    "💪 INTELIGÊNCIA EMOCIONAL: Autoconsciência, Controle, Automotivação, Empatia, Relacionamento"
  ],
  resumoCompleto: {
    "Fatores da Liderança": { conteudo: "São 4 fatores fundamentais: 1) LÍDER - pessoa que detém a arte de se destacar e influenciar a conduta humana; 2) LIDERADOS - equipe do líder, conhecimento essencial para exercício da liderança; 3) SITUAÇÃO - não existem fórmulas, o líder precisa compreender a dinâmica e aplicar conhecimentos como guia; 4) COMUNICAÇÃO - processo essencial de troca de ordens, informações e ideias.", mnemonic: "LLSC - 'Líderes Lideram Situações Comunicando'" },
    "Liderança Militar": { conteudo: "É o processo que consiste em influenciar pessoas, no sentido que ajam, voluntariamente, em prol do cumprimento da missão. Duas vias para influenciar: INTELECTUAL (razão, lógica) e EMOCIONAL (sentimentos, valores).", mnemonic: "IE - 'Intelecto + Emoção = Influência'" },
    "Eixos do Estilo de Liderança": { conteudo: "Os 3 grandes eixos são: 1) GRAU DE CENTRALIZAÇÃO DE PODER; 2) TIPO DE INCENTIVO; 3) FOCO DO LÍDER. Cada eixo possui diferentes estilos que o líder pode adotar conforme a situação.", mnemonic: "CIF - 'Centralização, Incentivo, Foco'" },
    "Grau de Centralização": { conteudo: "LIDERANÇA CENTRALIZADORA - alta concentração de poder; LIDERANÇA PARTICIPATIVA - condicionado por características pessoais, conhecimento técnico e engajamento; LIDERANÇA DELEGATIVA - transferência de responsabilidades.", mnemonic: "CPD - 'Centro, Participa, Delega'" },
    "Tipo de Incentivo": { conteudo: "LIDERANÇA TRANSFORMACIONAL - inspira e motiva além dos interesses imediatos; LIDERANÇA TRANSACIONAL - apela aos interesses e necessidades primárias, baseada em trocas econômicas ou psicológicas.", mnemonic: "TT - 'TransForma ou TransAção'" },
    "Foco do Líder": { conteudo: "ORIENTADA PARA TAREFA - foco na execução e resultados; ORIENTADA PARA RELACIONAMENTO - foco na manutenção e fortalecimento das relações pessoais, útil em tensão, frustração e desmotivação.", mnemonic: "TR - 'Tarefa ou Relacionamento'" },
    "Personalidade": { conteudo: "É a resultante psicofísica da interação da hereditariedade com o meio, manifestada através do comportamento. Características: TEMPORAL, depende de traços inatos e hereditários, é síntese única. TIPOS: Ajustada e Desajustada. Personalidade Compulsiva: transtorno com sentimento de dúvida, perfeccionismo, verificações excessivas.", mnemonic: "PHM - 'Psico + Herança + Meio = Personalidade'" },
    "Temperamento": { conteudo: "É a combinação de características inatas herdadas que afetam inconscientemente o comportamento. Segundo Hipócrates, 4 temperamentos básicos: SANGUÍNEO (alegre, otimista), MELANCÓLICO (triste, pessimista), COLÉRICO (irritado, explosivo), FLEUMÁTICO (calmo, apático).", mnemonic: "SMCF - 'Sangue, Mel, Cólera, Fleuma'" },
    "Id, Ego e Superego": { conteudo: "ID - instintos primitivos, impulsos inconscientes; EGO - reflexão, consciência da própria personalidade, encontra meio de satisfazer emocionalmente os impulsos; SUPEREGO - 'consciência moral', resposta automática certa ou errada diante de situações.", mnemonic: "IES - 'Instinto, Equilíbrio, Social (moral)'" },
    "Níveis de Liderança": { conteudo: "LÍDERES DIRETOS - primeira linha, subordinados veem chefes frequentemente (seções, pelotões, esquadras); LÍDERES ORGANIZACIONAIS - influência basicamente indireta, através de staff e comandantes subordinados; LÍDERES ESTRATÉGICOS - níveis mais elevados, influência ainda mais indireta e distante.", mnemonic: "DOE - 'Direto, Organizacional, Estratégico'" },
    "Síndrome de Burnout": { conteudo: "Esgotamento nervoso com características: EXAUSTÃO EMOCIONAL, ESTRESSE LIGADO AO TRABALHO, FALTA DE ENERGIA. É resultado de sobrecarga prolongada no trabalho.", mnemonic: "EEE - 'Exaustão, Estresse, Energia zero'" },
    "Janela de Johari": { conteudo: "Modelo de autoconhecimento com 4 áreas: ÁREA ABERTA (conhecido por mim e pelos outros), ÁREA CEGA (desconhecido por mim, conhecido pelos outros), ÁREA SECRETA (conhecido por mim, desconhecido pelos outros), ÁREA DESCONHECIDA (desconhecido por todos).", mnemonic: "ACSD - 'Aberta, Cega, Secreta, Desconhecida'" },
    "Atributos do Líder": { conteudo: "ALTRUÍSMO - se colocar no lugar dos liderados; FLEXIBILIDADE - maleabilidade de ideias, adaptar-se; CAPACIDADE DE RELACIONAMENTO INTERPESSOAL - lidar com pessoas com tato e respeito; INICIATIVA - ânimo para conceber e executar; + ENTUSIASMO, CAPACIDADE DECISÓRIA, AUTOCONFIANÇA, EXEMPLO, INTEGRIDADE ÉTICA, COMUNICAÇÃO, SENSO DE JUSTIÇA.", mnemonic: "AFRICE - 'Altruísmo, Flexibilidade, Relacionamento, Iniciativa, Comunicação, Ética'" },
    "Métodos de Modificação de Atitude": { conteudo: "Existem dois métodos: DIRETO - atua diretamente sobre a pessoa; INDIRETO - trabalha através de influências externas ao indivíduo.", mnemonic: "DI - 'Direto ou Indireto'" },
    "Modo de Agir dos Líderes": { conteudo: "O modo de agir é muito pessoal, subordinado às peculiaridades individuais, traços primários e tendências. Classificações: DITADOR (impõe pela força), TIRANO (oprime), LÍDER (influencia positivamente), COMANDANTE (guia com autoridade).", mnemonic: "DTLC - 'Ditador, Tirano, Líder, Comandante'" },
    "Processos de Influenciação": { conteudo: "9 aspectos inerentes: MOTIVAÇÃO, AFIRMAÇÃO, SUGESTÃO, EXEMPLO, EXORTAÇÃO, ARGUMENTAÇÃO, PUBLICIDADE, EFEITO DA ATMOSFERA, PRESTÍGIO.", mnemonic: "MASEAPEP - 9 formas positivas de influenciar" },
    "Inteligência Emocional": { conteudo: "5 pilares: AUTOCONSCIÊNCIA (conhecer-se), CONTROLAR AS EMOÇÕES (gerenciar-se), AUTOMOTIVAÇÃO (motivar-se), EMPATIA (entender outros), CAPACIDADE DE SE RELACIONAR (conectar-se).", mnemonic: "ACCER - 'AutoConsciência, Controle, automotivação, Empatia, Relacionamento'" },
    "Liderança Situacional": { conteudo: "Não existe um melhor estilo de liderança. Líderes eficazes utilizam estilos diferentes em distintos cenários. Depende da personalidade do líder, desenvolvimento do liderado, características da equipe, situação e cultura organizacional.", mnemonic: "PEDSC - 'Personalidade, Equipe, Desenvolvimento, Situação, Cultura'" },
    "Tipos de Incentivo": { conteudo: "Três tipos: MATERIAIS (salário, benefícios, bônus), SEMI-MATERIAIS (promoções, condições de trabalho, privilégios), IMATERIAIS (reconhecimento, elogios, prestígio).", mnemonic: "MSI - 'Material, Semi, Imaterial' (do concreto ao abstrato)" },
    "Motivo": { conteudo: "É uma condição interna que leva o indivíduo a agir e persistir em um dado comportamento, visando um determinado objetivo. MOTIVO = MOTOR INTERNO.", mnemonic: "CIA - 'Condição Interna para Ação'" },
    "Rosa das Virtudes": { conteudo: "INICIATIVA - ânimo pronto para conceber e executar; DISCIPLINA - cumprimento das normas; HONRA - valores morais elevados. As virtudes são valores morais vividos em atos.", mnemonic: "IDH - 'Iniciativa, Disciplina, Honra'" }
  },
  questoesPadrao: [
    {id:1,pergunta:"Quais são os fatores da liderança?",alternativas:["Situação, Comunicação, Líder e Chefe","Autoritário, delegação, competência","Líder e chefe","Líder, Liderados, Situação e Comunicação"],correta:3,explicacao:"Os 4 fatores da liderança são: Líder, Liderados, Situação e Comunicação",dica:"LLSC - 4 elementos: L, L, S e C"},
    {id:2,pergunta:"É a pessoa que, investida ou não da função de mando, detém a arte de se destacar (proeminência) e influenciar a conduta humana, conseguindo obediência voluntária, respeito e leal cooperação.",alternativas:["Líder","Liderado","Comunicação","Situação"],correta:0,explicacao:"LÍDER - pessoa que se destaca e influencia",dica:"Quem tem a 'arte de se destacar' é o LÍDER"},
    {id:3,pergunta:"\"É a equipe do líder.\" O conhecimento dos liderados é fator essencial para o exercício da liderança e depende do entendimento claro da natureza humana, das suas necessidades, emoções e motivações.",alternativas:["Líder","Liderado","Comunicação","Situação"],correta:1,explicacao:"LIDERADO é a equipe do líder, conhecê-los é essencial",dica:"A 'equipe' são os liderados"},
    {id:4,pergunta:"\"Não existem normas nem fórmulas que mostrem com exatidão o que deve ser feito. O líder precisa compreender a dinâmica do processo de liderança...\"",alternativas:["Líder","Liderado","Comunicação","Situação"],correta:3,explicacao:"SITUAÇÃO - não há fórmulas, cada situação é única",dica:"Cada 'situação' é particular e exige adaptação"},
    {id:5,pergunta:"É um processo essencial à liderança, que consiste na troca de ordens, informações e ideias, só ocorrendo quando a mensagem é recebida e compreendida.",alternativas:["Líder","Liderado","Comunicação","Situação"],correta:2,explicacao:"COMUNICAÇÃO é a troca de informações",dica:"'Troca de ordens e informações' = Comunicação"},
    {id:6,pergunta:"É o processo que consiste em influenciar pessoas, no sentido que ajam, voluntariamente, em prol do cumprimento da missão.",alternativas:["Liderança Militar","Delegação","Competência","Liderança Participativa"],correta:0,explicacao:"LIDERANÇA MILITAR - influenciar voluntariamente para cumprir missão",dica:"Influenciar para 'cumprimento da missão' = contexto militar"},
    {id:7,pergunta:"Vias para influenciar pessoas:",alternativas:["Intelectual e emocional","Autoritarismo e conveniência","Servir","Inspirar"],correta:0,explicacao:"As duas vias são INTELECTUAL (razão) e EMOCIONAL (sentimentos)",dica:"Cabeça (intelectual) e Coração (emocional)"},
    {id:8,pergunta:"São os 03 grandes eixos do estilo de Liderança:",alternativas:["Informação, comunicação e situação","Grau de centralização de Poder, tipo de Incentivo, foco do Líder","Correção, delegação e informação","Punição, tipo de incentivo e foco do líder"],correta:1,explicacao:"Os 3 eixos são: Centralização, Incentivo e Foco - CIF",dica:"CIF - Centralização, Incentivo, Foco"},
    {id:9,pergunta:"Quanto ao grau de centralização:",alternativas:["Liderança Centralizadora, Participativa e Delegativa","Liderança Transformacional e Transacional","Correção, delegação e informação","Liderança orientada para Tarefa e Relacionamento"],correta:0,explicacao:"Centralização: Centralizadora, Participativa, Delegativa - CPD",dica:"CPD - Centro, Participa, Delega"},
    {id:10,pergunta:"Quanto ao tipo de Incentivo:",alternativas:["Liderança Centralizadora, Participativa e Delegativa","Liderança Transformacional e Transacional","Correção, delegação e informação","Liderança orientada para Tarefa e Relacionamento"],correta:1,explicacao:"Incentivo: Transformacional e Transacional - TT",dica:"TT - Transforma ou Troca"},
    {id:11,pergunta:"Quanto ao foco do Líder:",alternativas:["Liderança Centralizadora, Participativa e Delegativa","Liderança Transformacional e Transacional","Correção, delegação e informação","Liderança orientada para Tarefa e Relacionamento"],correta:3,explicacao:"Foco: Tarefa (fazer) ou Relacionamento (pessoas) - TR",dica:"TR - Tarefa ou Relacionamento"},
    {id:12,pergunta:"É condicionado pelas características pessoais, pelo conhecimento técnico-profissional e pelo engajamento e motivação dos componentes do grupo como um todo. Na ausência do líder, uma boa equipe terá condições de continuar agindo de acordo com o planejamento.",alternativas:["Liderança Centralizadora","Liderança Transformacional","Liderança Participativa","Liderança Delegativa"],correta:2,explicacao:"LIDERANÇA PARTICIPATIVA - equipe preparada age mesmo sem líder",dica:"Equipe 'participa' e pode continuar sozinha"},
    {id:13,pergunta:"O foco do líder é a manutenção e fortalecimento das relações pessoais e do próprio grupo. Esse estilo pode ser útil em situações de tensão, frustração, insatisfação e desmotivação do grupo.",alternativas:["Liderança Centralizadora","Liderança Transformacional","Liderança orientada para Relacionamento","Liderança Delegativa"],correta:2,explicacao:"ORIENTADA PARA RELACIONAMENTO - foco em pessoas e relações",dica:"Foco em 'relações pessoais' = Relacionamento"},
    {id:14,pergunta:"É a resultante psicofísica da interação da hereditariedade com o meio, manifestada através do comportamento, cujas características são peculiares a cada pessoa:",alternativas:["Caráter","Personalidade","Id, EGO e SUPEREGO","Todas as respostas acima estão corretas"],correta:1,explicacao:"PERSONALIDADE = Herança + Meio, manifestada no comportamento",dica:"PHM - Psico + Herança + Meio"},
    {id:15,pergunta:"Área cega, área aberta, área secreta e área desconhecida, estamos falando:",alternativas:["Liderança democrática","Papel e status do líder","Janela de Johari","Aspectos da liderança"],correta:2,explicacao:"JANELA DE JOHARI tem 4 áreas: Aberta, Cega, Secreta, Desconhecida",dica:"ACSD - Aberta, Cega, Secreta, Desconhecida"},
    {id:16,pergunta:"Apela aos interesses e, especialmente, às necessidades primárias dos seguidores para alcançar os resultados organizacionais desejados. Fundamentada em uma relação de troca de natureza econômica ou psicológica.",alternativas:["Liderança orientada para a tarefa","Liderança Transformacional","Liderança Transacional","Todas as respostas acima estão corretas"],correta:2,explicacao:"LIDERANÇA TRANSACIONAL baseia-se em TROCA",dica:"TRANS-acional = TROCAs"},
    {id:17,pergunta:"\"A influência dos ___ é basicamente indireta: eles expedem suas políticas e diretivas e incentivam seus liderados por meio de seu staff e comandantes subordinados.\"",alternativas:["Líderes organizacionais","Líderes diretos","Líderes estratégicos","Líderes centralizadores"],correta:0,explicacao:"LÍDERES ORGANIZACIONAIS têm influência INDIRETA via staff",dica:"ORGANIZA-cionais = influência através da organização"},
    {id:18,pergunta:"Em relação aos atributos do Líder, a capacidade de se colocar no lugar dos liderados, preocupando-se com bem-estar pessoal e profissional destes:",alternativas:["Altruísmo","Flexibilidade","Respeito","Capacidade de relacionamento interpessoal"],correta:0,explicacao:"ALTRUÍSMO = colocar-se no lugar do outro (empatia)",dica:"ALTER = outro | ALTRU-ísmo = pensar no outro"},
    {id:19,pergunta:"\"___ exercem sua liderança no âmbito dos níveis mais elevados da instituição. Sua influência é ainda mais indireta e distante do que a dos líderes organizacionais.\"",alternativas:["Líderes participativos","Líderes estratégicos","Líderes diretos","Líderes centralizadores"],correta:1,explicacao:"LÍDERES ESTRATÉGICOS são os mais elevados e indiretos",dica:"ESTRATÉ-gicos = topo da estratégia"},
    {id:20,pergunta:"Em relação aos processos de influenciação, são os aspectos inerentes:",alternativas:["Desmotivação, afirmação, sugestão, exemplo, exortação, argumentação, publicidade, efeito da atmosfera, prestígio","Motivação, afirmação, sugestão, exemplo, exortação, argumentação, publicidade, efeito da atmosfera, prestígio","Motivação, afirmação, sugestão, exemplo, exortação, argumentação, restringir, efeito da atmosfera, prestígio","Motivação, afirmação, sugestão, exemplo, exortação, argumentação, publicidade, atmosfera pessimista, prestígio"],correta:1,explicacao:"9 aspectos: Motivação, Afirmação, Sugestão, Exemplo, Exortação, Argumentação, Publicidade, Efeito da atmosfera, Prestígio",dica:"MASEAPEP - 9 aspectos positivos"},
    {id:21,pergunta:"\"Os ___ devem possuir muitas habilidades interpessoais, conceituais, técnicas e táticas. Usam a ética para pautar suas condutas.\"",alternativas:["Líderes delegativos","Líderes organizacionais","Líderes diretos","Líderes estratégicos"],correta:2,explicacao:"LÍDERES DIRETOS precisam de múltiplas habilidades práticas",dica:"DIRETOS = contato direto, mais habilidades práticas"},
    {id:22,pergunta:"Segundo Hipócrates, os temperamentos básicos são:",alternativas:["SANGUÍNEO e MELANCÓLICO","COLÉRICO","FLEUMÁTICO","Todas as respostas acima estão corretas"],correta:3,explicacao:"4 temperamentos: Sanguíneo, Melancólico, Colérico, Fleumático",dica:"SMCF - 4 letras = 4 temperamentos"},
    {id:23,pergunta:"A PERSONALIDADE é:",alternativas:["Temporal","Depende de certos traços inatos e hereditários","É uma síntese única, distinguindo cada ser humano de seus semelhantes","Todas as respostas acima"],correta:3,explicacao:"Personalidade: temporal, hereditária E única - TODAS as características",dica:"Personalidade tem TODAS essas características"},
    {id:24,pergunta:"\"É a combinação de características inatas que herdamos dos nossos pais que, de forma inconsciente, afetam o nosso comportamento.\"",alternativas:["Temperamento","Caráter","Personalidade","Liderança"],correta:0,explicacao:"TEMPERAMENTO = características INATAS herdadas",dica:"TEMPER-amento = aquilo com que nascemos (inato)"},
    {id:25,pergunta:"\"É a reflexão, é a consciência da própria personalidade. Sua função é encontrar um meio de satisfazer emocionalmente os impulsos.\"",alternativas:["ID","Superego","Personalidade","EGO"],correta:3,explicacao:"EGO = reflexão, consciência, EQUILIBRA id e superego",dica:"EGO = Eu consciente, equilíbrio entre impulsos e moral"},
    {id:26,pergunta:"São os tipos de personalidade:",alternativas:["Normal e participativa","Delegativa e desajustada","Competitiva e regular","Ajustada e desajustada"],correta:3,explicacao:"2 tipos de personalidade: AJUSTADA e DESAJUSTADA",dica:"A-D: Ajustada ou Desajustada"},
    {id:27,pergunta:"É um transtorno de personalidade caracterizado por um constante sentimento de dúvida, perfeccionismo, escrupulosidade, verificações, e preocupação excessiva com pormenores:",alternativas:["Personalidade perversa","Personalidade compulsiva","Personalidade dependente","Personalidade explosiva"],correta:1,explicacao:"Personalidade COMPULSIVA = dúvida, perfeccionismo, verificações excessivas",dica:"COM-pulsiva = compulsão por verificar"},
    {id:28,pergunta:"Uma condição interna que leva o indivíduo a agir e persistir em um dado comportamento, visando um determinado objetivo.",alternativas:["Motivo","Incentivo","Liderança Participativa","Liderança Delegativa"],correta:0,explicacao:"MOTIVO = condição INTERNA que leva à ação",dica:"MOTIVO = MOTOR interno"},
    {id:29,pergunta:"Tipos de incentivos capazes de estimular o indivíduo no trabalho:",alternativas:["Imateriais","Materiais","Semi-materiais","Todas as respostas acima"],correta:3,explicacao:"3 tipos: Materiais, Semi-materiais, Imateriais (MSI)",dica:"MSI - Material, Semi, Imaterial"},
    {id:30,pergunta:"Síndrome de Burnout – Esgotamento nervoso - tem como características:",alternativas:["Exaustão emocional","Estresse ligado ao trabalho","Falta de energia","Todas as respostas acima"],correta:3,explicacao:"BURNOUT = Exaustão + Estresse + Falta de energia (EEE)",dica:"BURN-out = queimado = 3 E's"},
    {id:31,pergunta:"Popularmente é chamado de \"consciência\" — representa a resposta automática, \"certa\" ou \"errada\", que surge na pessoa diante das várias situações que exigem uma tomada de posição:",alternativas:["ID","Superego","Personalidade","EGO"],correta:1,explicacao:"SUPEREGO = consciência moral, certo x errado",dica:"SUPER-ego = acima do ego = consciência moral"},
    {id:32,pergunta:"São os principais atributos de um LÍDER:",alternativas:["Entusiasmo, Capacidade Decisória e Autoconfiança","Exemplo e Integridade Ética","Comunicação, Iniciativa e Senso de Justiça","Todas as respostas acima"],correta:3,explicacao:"Todos são atributos do líder - AFRICE+",dica:"AFRICE - múltiplos atributos essenciais"},
    {id:33,pergunta:"AUTOCONSCIÊNCIA, CONTROLAR AS EMOÇÕES, AUTOMOTIVAÇÃO, EMPATIA E CAPACIDADE DE SE RELACIONAR, são os cinco pilares que podem nos ajudar a desenvolver a:",alternativas:["Liderança participativa","Liderança Centralizadora","ID, EGO e SUPEREGO","Inteligência Emocional"],correta:3,explicacao:"5 pilares da INTELIGÊNCIA EMOCIONAL: ACCER",dica:"ACCER - 5 dedos = 5 pilares"},
    {id:34,pergunta:"Quais são os métodos que podem modificar o sistema de atitude dos indivíduos?",alternativas:["Servir e Punir","Liderar e Julgar","Intelectual e Emocional","Direto e Indireto"],correta:3,explicacao:"Métodos de modificação de atitude: DIRETO e INDIRETO",dica:"DI - Direto ou Indireto"},
    {id:35,pergunta:"\"Essa é a primeira linha de liderança e ocorre em organizações onde os subordinados estão acostumados a ver seus chefes frequentemente: seções, pelotões e esquadras.\" Qual nível de liderança?",alternativas:["Liderança Organizacional","Liderança Estratégica","Liderança Participativa","Liderança Direta"],correta:3,explicacao:"LIDERANÇA DIRETA = primeira linha, contato frequente",dica:"DIRETA = ver DIRETAMENTE, frequentemente"},
    {id:36,pergunta:"Em relação aos atributos do Líder: \"A habilidade para lidar com pessoas, sejam superiores, pares ou subordinados, com tato, respeito e consideração individualizada\":",alternativas:["Capacidade decisória","Capacidade de relacionamento interpessoal","Comunicação","Humildade"],correta:1,explicacao:"CAPACIDADE DE RELACIONAMENTO INTERPESSOAL = lidar com pessoas com tato",dica:"Relacionamento INTER-pessoal = entre pessoas"},
    {id:37,pergunta:"Em relação aos atributos do Líder: \"Maleabilidade de ideias e habilidade para integrar informações novas, adaptar-se a mudanças. Ele atua corretamente de modo diverso em diferentes situações.\"",alternativas:["Coragem física","Capacidade de relacionamento interpessoal","Flexibilidade","Autocontrole"],correta:2,explicacao:"FLEXIBILIDADE = maleabilidade, adaptar-se",dica:"FLEXÍVEL = dobra, adapta"},
    {id:38,pergunta:"\"É a combinação de características inatas que herdamos dos nossos pais que, de forma inconsciente, afetam o nosso comportamento.\" Estamos falando de:",alternativas:["Inteligência emocional","Temperamento","Caráter","Personalidade"],correta:1,explicacao:"TEMPERAMENTO = características INATAS herdadas",dica:"INATAS = nasce com = temperamento"},
    {id:39,pergunta:"Como são classificados os MODOS DE AGIR DOS LÍDERES?",alternativas:["Ditador e Tirano","Líder","Comandante","Todas as respostas acima"],correta:3,explicacao:"Modos: Ditador, Tirano, Líder, Comandante - DTLC",dica:"DTLC - do pior ao melhor"},
    {id:40,pergunta:"\"Não existe um melhor Estilo de Liderança. Os líderes eficazes utilizam estilos diferentes, em distintos cenários.\" Essa é a teoria da:",alternativas:["Liderança Situacional","Liderança Participativa","Liderança Transformacional","Liderança Delegativa"],correta:0,explicacao:"LIDERANÇA SITUACIONAL - adaptar estilo à situação",dica:"PEDSC - Personalidade, Equipe, Desenvolvimento, Situação, Cultura"}
  ],
  flashcards: [
    {frente:"Quais são os 4 fatores da liderança?",verso:"1) Líder - arte de se destacar\n2) Liderados - equipe do líder\n3) Situação - cada caso é único\n4) Comunicação - troca de informações",dica:"LLSC",memorização:"Visualize um LÍDER com sua EQUIPE em uma SITUAÇÃO COMUNICANDO"},
    {frente:"O que é Liderança Militar?",verso:"Processo de influenciar pessoas para que ajam VOLUNTARIAMENTE em prol do cumprimento da MISSÃO",dica:"Voluntária + Missão",memorização:"Influência militar = ação voluntária + missão cumprida"},
    {frente:"Quais os 3 eixos do estilo de liderança?",verso:"1) Grau de CENTRALIZAÇÃO de Poder\n2) Tipo de INCENTIVO\n3) FOCO do Líder",dica:"CIF",memorização:"3 botões de controle: onde está o PODER, que PRÊMIO oferece, onde está a ATENÇÃO"},
    {frente:"Estilos quanto à CENTRALIZAÇÃO?",verso:"CENTRALIZADORA - concentra poder\nPARTICIPATIVA - envolve equipe\nDELEGATIVA - transfere responsabilidade",dica:"CPD",memorização:"Centro, Participa, Delega"},
    {frente:"Estilos quanto ao INCENTIVO?",verso:"TRANSFORMACIONAL - inspira, motiva, transforma\nTRANSACIONAL - troca, recompensas, necessidades básicas",dica:"TT",memorização:"TransFORMA pessoas vs TransAÇÃO comercial"},
    {frente:"Estilos quanto ao FOCO?",verso:"ORIENTADA PARA TAREFA - resultado, execução\nORIENTADA PARA RELACIONAMENTO - pessoas, clima, motivação",dica:"TR",memorização:"FAZER coisas vs CUIDAR de pessoas"},
    {frente:"O que é PERSONALIDADE?",verso:"Resultante PSICOFÍSICA da interação HEREDITARIEDADE + MEIO, manifestada no COMPORTAMENTO. É única para cada pessoa.",dica:"PHM",memorização:"P = H × M (Personalidade = Herança vezes Meio)"},
    {frente:"O que é TEMPERAMENTO?",verso:"Combinação de características INATAS HERDADAS que afetam INCONSCIENTEMENTE o comportamento",dica:"TEMPER = aquilo com que nascemos",memorização:"TEMPERAMENTO já vem de fábrica (nascemos com ele)"},

          {vf.confirmado&&<div className="explicacao-box acerto" style={{marginTop:'1rem'}}><div className="memo-box">🧠 <strong>Memorização:</strong> {conj.memorizacao}</div></div>}
        </div>
        <div className="navegacao-questoes">
          <button className="btn-secundario" onClick={()=>setVf({atual:vf.atual-1,respostas:{},mostrarDica:false,confirmado:false})} disabled={vf.atual===0}>← Anterior</button>
          <button className="btn-perigo" onClick={()=>setVf({...vf,respostas:{},confirmado:false,mostrarDica:false})}>🔄 Refazer</button>
          {vf.atual<exercicios.vOuF.length-1&&<button className="btn-primario" onClick={()=>setVf({atual:vf.atual+1,respostas:{},mostrarDica:false,confirmado:false})}>Próximo →</button>}
        </div>
      </div>
    );
  };

  // ==================== DEFINIÇÕES ====================
  const renderDefinicoes = () => {
    const q = exercicios.definicoes[def.atual];
    return (
      <div className="container-exercicio">
        <div className="titulo-secao">📖 Definições</div>
        <div className="contador-questoes">Questão {def.atual+1} de {exercicios.definicoes.length}</div>
        <div className="progresso-barra-container"><div className="progresso-barra" style={{width:`${((def.atual+1)/exercicios.definicoes.length)*100}%`}}></div></div>
        <div className="questao-box">
          <p style={{fontSize:'1.1rem',color:'#667eea',fontWeight:'bold',marginBottom:'.5rem'}}>Defina o termo:</p>
          <p className="pergunta-questao" style={{fontSize:'1.8rem',textAlign:'center',padding:'1rem',background:'linear-gradient(135deg,#667eea,#764ba2)',color:'#fff',borderRadius:'10px',marginBottom:'1.5rem'}}>{q.termo}</p>
          <textarea className="textarea-resposta" placeholder="Escreva sua definição aqui..." value={def.texto} onChange={e=>setDef({...def,texto:e.target.value})} disabled={def.confirmado}/>
          {def.confirmado&&<div className="resposta-usuario"><strong>Sua resposta:</strong> {def.texto||'(sem resposta)'}</div>}
          <div className="botoes-questao">
            <button className="btn-secundario" onClick={()=>setDef({...def,mostrarDica:!def.mostrarDica})}>💡 {def.mostrarDica?'Ocultar':'Ver'} Dica</button>
            <button className="btn-primario" onClick={()=>setDef({...def,confirmado:true})} disabled={def.confirmado}>✓ Confirmar</button>
          </div>
          {def.mostrarDica&&<div className="dica-box">💡 <strong>Dica:</strong> {q.dica}</div>}
          {def.confirmado&&(
            <div className="explicacao-box acerto">
              <div className="gabarito-box"><strong>✅ Definição correta:</strong> {q.resposta}</div>
              <div className="memo-box" style={{marginTop:'1rem'}}>🧠 <strong>Memorização:</strong> {q.memorizacao}</div>
            </div>
          )}
        </div>
        <div className="navegacao-questoes">
          <button className="btn-secundario" onClick={()=>setDef({atual:def.atual-1,texto:'',mostrarDica:false,confirmado:false})} disabled={def.atual===0}>← Anterior</button>
          <button className="btn-perigo" onClick={()=>setDef({...def,texto:'',confirmado:false,mostrarDica:false})}>🔄 Refazer</button>
          {def.atual<exercicios.definicoes.length-1&&<button className="btn-primario" onClick={()=>setDef({atual:def.atual+1,texto:'',mostrarDica:false,confirmado:false})}>Próxima →</button>}
        </div>
      </div>
    );
  };

  // ==================== COMPLETE AS LACUNAS ====================
  const renderLacunas = () => {
    const q = exercicios.completeLacunas[comp.atual];
    return (
      <div className="container-exercicio">
        <div className="titulo-secao">✏️ Complete as Lacunas</div>
        <div className="contador-questoes">Questão {comp.atual+1} de {exercicios.completeLacunas.length}</div>
        <div className="progresso-barra-container"><div className="progresso-barra" style={{width:`${((comp.atual+1)/exercicios.completeLacunas.length)*100}%`}}></div></div>
        <div className="questao-box">
          <p className="pergunta-questao">{q.texto}</p>
          <textarea className="textarea-resposta" placeholder={`Complete com as ${q.respostas.length} palavras/termos corretos...`} value={comp.texto} onChange={e=>setComp({...comp,texto:e.target.value})} disabled={comp.confirmado}/>
          {comp.confirmado&&<div className="resposta-usuario"><strong>Sua resposta:</strong> {comp.texto||'(sem resposta)'}</div>}
          <div className="botoes-questao">
            <button className="btn-secundario" onClick={()=>setComp({...comp,mostrarDica:!comp.mostrarDica})}>💡 {comp.mostrarDica?'Ocultar':'Ver'} Dica</button>
            <button className="btn-primario" onClick={()=>setComp({...comp,confirmado:true})} disabled={comp.confirmado}>✓ Confirmar</button>
          </div>
          {comp.mostrarDica&&<div className="dica-box">💡 <strong>Dica:</strong> {q.dica}</div>}
          {comp.confirmado&&(
            <div className="explicacao-box acerto">
              <div className="gabarito-box"><strong>✅ Respostas:</strong> {q.respostas.join(', ')}</div>
              <div className="memo-box" style={{marginTop:'1rem'}}>🧠 <strong>Memorização:</strong> {q.memorizacao}</div>
            </div>
          )}
        </div>
        <div className="navegacao-questoes">
          <button className="btn-secundario" onClick={()=>setComp({atual:comp.atual-1,texto:'',mostrarDica:false,confirmado:false})} disabled={comp.atual===0}>← Anterior</button>
          <button className="btn-perigo" onClick={()=>setComp({...comp,texto:'',confirmado:false,mostrarDica:false})}>🔄 Refazer</button>
          {comp.atual<exercicios.completeLacunas.length-1&&<button className="btn-primario" onClick={()=>setComp({atual:comp.atual+1,texto:'',mostrarDica:false,confirmado:false})}>Próxima →</button>}
        </div>
      </div>
    );
  };

  // ==================== NAVEGAÇÃO E RENDER PRINCIPAL ====================
  const tabs = [
    {id:'inicio',label:'🏠 Início'},{id:'superResumo',label:'⚡ Resumo'},{id:'resumo',label:'📚 Completo'},
    {id:'mapa',label:'🗺️ Mapa'},{id:'flashcards',label:'🎴 Flashcards'},{id:'consulta',label:'🔍 Consulta'},
    {id:'questoes',label:'📝 Questões'},{id:'multipla',label:'✅ Múltipla'},{id:'certoErrado',label:'✔️ C/E'},
    {id:'correlacione',label:'🔗 Correl.'},{id:'cite',label:'📣 Cite'},{id:'liste',label:'📋 Liste'},
    {id:'vof',label:'🔵 V/F'},{id:'definicoes',label:'📖 Def.'},{id:'lacunas',label:'✏️ Lacunas'}
  ];

  const renderAtivo = () => {
    switch(abaAtiva){
      case 'superResumo': return renderSuperResumo();
      case 'resumo': return renderResumo();
      case 'mapa': return renderMapa();
      case 'flashcards': return renderFlashcards();
      case 'consulta': return renderConsulta();
      case 'questoes': return renderQuestoesPadrao();
      case 'multipla': return renderMultipla();
      case 'certoErrado': return renderCertoErrado();
      case 'correlacione': return renderCorrelacione();
      case 'cite': return renderCite();
      case 'liste': return renderListe();
      case 'vof': return renderVouF();
      case 'definicoes': return renderDefinicoes();
      case 'lacunas': return renderLacunas();
      default: return renderInicio();
    }
  };

  return (
    <div className="App">
      <nav className="navbar">
        <div className="nav-brand">🎖️ Liderança EsFM</div>
        <div className="nav-links">
          {tabs.map(t=>(
            <button key={t.id} className={abaAtiva===t.id?'ativo':''} onClick={()=>navegar(t.id)}>{t.label}</button>
          ))}
        </div>
      </nav>
      <main className="conteudo-principal">{renderAtivo()}</main>
      <footer className="rodape">📚 App de Estudos — Liderança e Bases Psicológicas | EsFM | "Onde há vontade, há sucesso!"</footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
